<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Power and RP2040 support parts</title><desc>USB 5 V feeds a 3.3 V regulator, which feeds the mic supply through a ferrite bead and the RP2040 supply pins. The RP2040 also needs a crystal, reset, USB resistors, flash and core regulator wiring.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" fill="#ffffff"/>
<rect x="40" y="30" width="110" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="95.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">USB 5 V</text>
<line x1="150" y1="52" x2="178" y2="52" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="180" y="30" width="140" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="250.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">3.3 V regulator</text>
<text x="250.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">one +3V3 net name</text>
<line x1="320" y1="52" x2="348" y2="52" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="350" y="30" width="140" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="420.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Ferrite bead</text>
<text x="420.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">plus cap to ground</text>
<line x1="490" y1="52" x2="518" y2="52" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520" y="30" width="120" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="580.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">micbias</text>
<text x="580.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">8 mic VDD pins</text>
<path d="M250 74 L250 104 L560 104 L560 128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="130" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120.0" y="144.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">12 MHz crystal</text>
<text x="120.0" y="161.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">load caps, 1 k series</text>
<rect x="40" y="210" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Reset + SWD</text>
<text x="120.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">RUN pull-up, button</text>
<rect x="40" y="290" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120.0" y="304.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">USB connector</text>
<text x="120.0" y="321.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">27 Ω on D+ and D−</text>
<rect x="260" y="130" width="160" height="204" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340.0" y="222.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">RP2040</text>
<text x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">won't run alone</text>
<line x1="200" y1="152" x2="258" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="232" x2="258" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="200" y1="312" x2="258" y2="312" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="480" y="130" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560.0" y="144.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">3.3 V supply pins</text>
<text x="560.0" y="161.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">100 nF at each pin</text>
<rect x="480" y="210" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">QSPI flash</text>
<text x="560.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">on the QSPI pins</text>
<rect x="480" y="290" width="160" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560.0" y="304.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Core regulator</text>
<text x="560.0" y="321.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">VIN 3.3 V, VOUT 1.1 V</text>
<line x1="480" y1="152" x2="422" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="422" y1="232" x2="478" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="422" y1="312" x2="478" y2="312" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>