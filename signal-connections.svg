<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Audio board signal connections</title><desc>Four microphone pairs send PDM data on four lines to the RP2040 and share one clock from it. The RP2040 sends I2S and I2C to the amplifier, which drives an output filter and speaker.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="420" fill="#ffffff"/>
<rect x="50" y="40" width="130" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Mic pair 1</text>
<text x="115.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">gnd mic + vdd mic</text>
<rect x="50" y="90" width="130" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Mic pair 2</text>
<text x="115.0" y="119.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">gnd mic + vdd mic</text>
<rect x="50" y="140" width="130" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Mic pair 3</text>
<text x="115.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">gnd mic + vdd mic</text>
<rect x="50" y="190" width="130" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Mic pair 4</text>
<text x="115.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">gnd mic + vdd mic</text>
<path d="M290 230 L290 262 L30 262 L30 60" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="30" y1="60" x2="48" y2="60" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="30" y1="110" x2="48" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="30" y1="160" x2="48" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="30" y1="210" x2="48" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="282" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">pdmclk (GPIO10), 22–100 Ω in series</text>
<line x1="180" y1="60" x2="258" y2="60" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="219" y="49" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">pdmdata1</text>
<text x="219" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO11</text>
<line x1="180" y1="110" x2="258" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="219" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">pdmdata2</text>
<text x="219" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO12</text>
<line x1="180" y1="160" x2="258" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="219" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">pdmdata3</text>
<text x="219" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO13</text>
<line x1="180" y1="210" x2="258" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="219" y="199" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">pdmdata4</text>
<text x="219" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO14</text>
<rect x="260" y="40" width="150" height="190" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="335.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">RP2040</text>
<text x="335.0" y="124.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">PIO reads PDM</text>
<text x="335.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">decimates to 48 kHz</text>
<text x="335.0" y="168.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">drives I²S out</text>
<line x1="410" y1="70" x2="508" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="459" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO16 SDIN</text>
<line x1="410" y1="110" x2="508" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="459" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO17 SCLK</text>
<line x1="410" y1="150" x2="508" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="459" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO18 LRCLK</text>
<line x1="410" y1="190" x2="508" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="459" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GPIO4/5 I²C</text>
<rect x="510" y="40" width="130" height="190" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="575.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">TAS5805M</text>
<text x="575.0" y="124.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">stereo class-D amp</text>
<text x="575.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">no MCLK needed</text>
<text x="575.0" y="168.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">PDN high, ADR set</text>
<line x1="320" y1="230" x2="320" y2="300" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="380" y1="230" x2="380" y2="300" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="210" y="300" width="140" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="280.0" y="314.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">I²C header</text>
<text x="280.0" y="331.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">pull-ups to 3.3 V</text>
<rect x="370" y="300" width="120" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="430.0" y="314.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">ASI header</text>
<text x="430.0" y="331.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">probe pins only</text>
<line x1="575" y1="230" x2="575" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510" y="272" width="130" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="575.0" y="286.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Output filter</text>
<text x="575.0" y="303.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">per datasheet</text>
<line x1="575" y1="316" x2="575" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="510" y="348" width="130" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="575.0" y="370.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Speaker</text>
</svg>